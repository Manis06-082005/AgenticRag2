project:
name: AgenticRag
version: "1.0.0"

data:
raw_dir: data/raw
processed_dir: data/processed

chunking:
chunk_size: 500
chunk_overlap: 50

embedding:
model_name: sentence-transformers/all-MiniLM-L6-v2
dimension: 384

vectorstore:
type: chroma
persist_directory: vectorstore
collection_name: agentic_rag

retriever:
search_type: similarity
top_k: 5

reranker:
enabled: true
top_k: 3

agent:
max_retries: 2

llm:
temperature: 0.0
max_tokens: 512

evaluation:
enabled: true
